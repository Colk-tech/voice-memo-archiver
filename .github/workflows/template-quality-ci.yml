name: Quality CI [template]

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: astral-sh/setup-uv@c97f06e356bcca1b426f396ef93ec35ce149ce7b
        with:
          version: "0.13.1"
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run mypy --strict
      - run: >-
          uv run pytest --cov=pocs/sqlite_probe --cov-branch
          --cov-report=xml --cov-fail-under=100 -W error::ResourceWarning
      - run: uv run yamllint .github/workflows
