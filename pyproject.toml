[project]
name = "voice-memo-archiver"
version = "0.1.0"
description = "Read-only Voice Memos feasibility tools"
requires-python = ">=3.14"

[project.scripts]
vma-source-probe = "voice_memo_archiver.bootstrap.probe:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["mypy", "pytest", "pytest-cov", "ruff", "tach", "ty", "yamllint"]

[tool.ruff]
target-version = "py314"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["src"]

[tool.coverage.run]
omit = ["*/test_*.py"]
