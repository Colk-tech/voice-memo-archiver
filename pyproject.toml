[project]
name = "voice-memo-archiver"
version = "0.1.0"
description = "Read-only Voice Memos feasibility experiments"
requires-python = ">=3.14"

[tool.uv]
package = false

[dependency-groups]
dev = ["mypy", "pytest", "pytest-cov", "ruff", "ty", "yamllint"]

[tool.ruff]
target-version = "py314"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["pocs"]

[tool.pytest.ini_options]
testpaths = ["pocs"]
pythonpath = ["."]

[tool.coverage.run]
omit = ["*/test_*.py"]
